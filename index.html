<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magazyn Palet (Online)</title>
<style>
:root{
  --bg:#f4f6f8; --panel:#fff; --text:#18212f; --muted:#687386;
  --line:#e5e9ef; --primary:#2563eb; --primary2:#1d4ed8; --danger:#dc2626;
  --green:#16a34a; --shadow:0 10px 30px rgba(20,30,50,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}
button{cursor:pointer;border:0}
.app{min-height:100vh}
.topbar{height:72px;background:#111827;color:#fff;display:flex;align-items:center;padding:0 28px;gap:18px;position:sticky;top:0;z-index:20}
.logo{font-weight:800;font-size:21px;letter-spacing:-.4px;display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;border-radius:9px;background:#2563eb;display:grid;place-items:center;font-size:19px}
.topbar .spacer{flex:1}
.save-status{font-size:13px;color:#34d399;font-weight:600}
.container{max-width:1400px;margin:0 auto;padding:28px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}
h1{font-size:30px;margin:0 0 7px;letter-spacing:-.8px}
.subtitle{color:var(--muted);margin:0}
.primary{background:var(--primary);color:white;padding:11px 16px;border-radius:9px;font-weight:700;box-shadow:0 4px 12px rgba(37,99,235,.22)}
.primary:hover{background:var(--primary2)}
.secondary{background:#fff;color:var(--text);border:1px solid var(--line);padding:10px 14px;border-radius:9px;font-weight:600}
.danger{background:#fff;color:var(--danger);border:1px solid #fecaca;padding:9px 12px;border-radius:8px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px 18px;box-shadow:0 3px 10px rgba(20,30,50,.03)}
.stat-label{font-size:13px;color:var(--muted);margin-bottom:7px}.stat-value{font-size:25px;font-weight:800}
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.search{position:relative;flex:1}.search input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.search input:focus{border-color:#93b4ff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.search span{position:absolute;left:14px;top:10px;font-size:18px;color:#8b96a7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:16px}
.pallet{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:var(--shadow);transition:.15s;cursor:pointer;position:relative}
.pallet:hover{transform:translateY(-2px);border-color:#b8c7e4}
.pallet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
