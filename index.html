<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magazyn Palet</title>
<style>
:root{
  --bg:#f4f6f8; --panel:#fff; --text:#18212f; --muted:#687386;
  --line:#e5e9ef; --primary:#2563eb; --primary2:#1d4ed8; --danger:#dc2626;
  --green:#16a34a; --shadow:0 10px 30px rgba(20,30,50,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}
button{cursor:pointer;border:0}
.app{min-height:100vh}
.topbar{height:72px;background:#111827;color:#fff;display:flex;align-items:center;padding:0 28px;gap:18px;position:sticky;top:0;z-index:20}
.logo{font-weight:800;font-size:21px;letter-spacing:-.4px;display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;border-radius:9px;background:#2563eb;display:grid;place-items:center;font-size:19px}
.topbar .spacer{flex:1}
.save-status{font-size:13px;color:#aeb9c9}
.container{max-width:1400px;margin:0 auto;padding:28px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}
h1{font-size:30px;margin:0 0 7px;letter-spacing:-.8px}
.subtitle{color:var(--muted);margin:0}
.primary{background:var(--primary);color:white;padding:11px 16px;border-radius:9px;font-weight:700;box-shadow:0 4px 12px rgba(37,99,235,.22)}
.primary:hover{background:var(--primary2)}
.secondary{background:#fff;color:var(--text);border:1px solid var(--line);padding:10px 14px;border-radius:9px;font-weight:600}
.danger{background:#fff;color:var(--danger);border:1px solid #fecaca;padding:9px 12px;border-radius:8px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px 18px;box-shadow:0 3px 10px rgba(20,30,50,.03)}
.stat-label{font-size:13px;color:var(--muted);margin-bottom:7px}.stat-value{font-size:25px;font-weight:800}
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.search{position:relative;flex:1}.search input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.search input:focus{border-color:#93b4ff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.search span{position:absolute;left:14px;top:10px;font-size:18px;color:#8b96a7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:16px}
.pallet{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:var(--shadow);transition:.15s;cursor:pointer;position:relative}
.pallet:hover{transform:translateY(-2px);border-color:#b8c7e4}
.pallet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pallet-code{font-size:19px;font-weight:800}.badge{font-size:11px;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:5px 8px;font-weight:700}
.pallet-name{font-size:13px;color:var(--muted);margin-top:3px}
.pallet-meta{margin-top:17px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.pallet-actions{display:flex;gap:7px;margin-top:14px}
.pallet-actions button{flex:1}
.empty{grid-column:1/-1;text-align:center;background:#fff;border:1px dashed #cbd5e1;border-radius:13px;padding:55px 20px;color:var(--muted)}
.empty .icon{font-size:38px;margin-bottom:8px}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal-backdrop.show{display:flex}
.modal{background:#fff;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:15px;box-shadow:0 25px 70px rgba(0,0,0,.25)}
.modal.small{width:min(520px,100%)}
.modal-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px}
.modal-head h2{margin:0;font-size:20px}.close{background:#f3f4f6;width:34px;height:34px;border-radius:8px;font-size:20px;color:#5b6575}
.modal-body{padding:22px}.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;outline:none}.field input:focus{border-color:#93b4ff}
.field.full{grid-column:1/-1}
.items-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.items-head h3{margin:0;font-size:15px}
.item-row{display:grid;grid-template-columns:1.5fr .65fr .9fr 38px;gap:8px;margin-bottom:8px}
.item-row input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px}
.remove-item{background:#fee2e2;color:#b91c1c;border-radius:8px;font-size:18px}
.add-item{background:#f0f6ff;color:#1d4ed8;padding:8px 11px;border-radius:8px;font-weight:700}
.details{padding:22px}
.detail-title{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}
.detail-title h2{margin:0;font-size:25px}.detail-title p{margin:5px 0 0;color:var(--muted)}
.detail-actions{display:flex;gap:8px}
.detail-info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.info{background:#f7f9fc;border-radius:10px;padding:12px}.info span{display:block;font-size:12px;color:var(--muted)}.info strong{display:block;margin-top:3px}
.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:14px}.table th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.notice{background:#eff6ff;color:#1e40af;border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:16px}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.hero{align-items:flex-start;flex-direction:column}.topbar{padding:0 15px}.container{padding:18px}.form-grid,.detail-info{grid-template-columns:1fr}.item-row{grid-template-columns:1fr 80px 100px 38px}}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.toolbar{flex-direction:column;align-items:stretch}.save-status{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="logo"><div class="logo-icon">▦</div> Magazyn Palet</div>
  <div class="spacer"></div><div class="save-status" id="saveStatus">Dane zapisują się automatycznie</div>
</header>

<main class="container">
  <section class="hero">
    <div><h1>Magazyn</h1><p class="subtitle">Zarządzaj paletami i sprawdzaj ich zawartość w jednym miejscu.</p></div>
    <button class="primary" onclick="openPalletForm()">＋ Dodaj paletę</button>
  </section>

  <section class="stats">
    <div class="stat"><div class="stat-label">Wszystkie palety</div><div class="stat-value" id="statPallets">0</div></div>
    <div class="stat"><div class="stat-label">Pozycje na paletach</div><div class="stat-value" id="statItems">0</div></div>
    <div class="stat"><div class="stat-label">Łączna ilość sztuk</div><div class="stat-value" id="statQty">0</div></div>
    <div class="stat"><div class="stat-label">Ostatnia aktualizacja</div><div class="stat-value" id="statDate" style="font-size:17px">—</div></div>
  </section>

  <div class="toolbar">
    <div class="search"><span>⌕</span><input id="search" placeholder="Szukaj po numerze palety, nazwie lub produkcie..." oninput="render()"></div>
    <button class="secondary" onclick="exportData()">⬇ Eksport danych</button>
    <button class="secondary" onclick="document.getElementById('importFile').click()">⬆ Import</button>
    <input type="file" id="importFile" accept=".json" hidden onchange="importData(event)">
  </div>
  <section class="grid" id="palletGrid"></section>
</main>
</div>

<div class="modal-backdrop" id="formModal">
 <div class="modal">
  <div class="modal-head"><h2 id="formTitle">Dodaj paletę</h2><button class="close" onclick="closeModal('formModal')">×</button></div>
  <div class="modal-body">
   <div class="form-grid">
    <div class="field"><label>Numer palety *</label><input id="pCode" placeholder="np. P-001"></div>
    <div class="field"><label>Nazwa / opis</label><input id="pName" placeholder="np. Towar do wysyłki"></div>
    <div class="field full"><label>Lokalizacja</label><input id="pLocation" placeholder="np. Regał A / Miejsce 12"></div>
   </div>
   <div style="margin-top:24px">
    <div class="items-head"><h3>Zawartość palety</h3><button class="add-item" onclick="addItemRow()">＋ Dodaj produkt</button></div>
    <div id="itemRows"></div>
   </div>
  </div>
  <div class="modal-foot"><button class="secondary" onclick="closeModal('formModal')">Anuluj</button><button class="primary" onclick="savePallet()">Zapisz paletę</button></div>
 </div>
</div>

<div class="modal-backdrop" id="detailModal">
 <div class="modal">
  <div class="details" id="detailContent"></div>
 </div>
</div>

<script>
const KEY='magazyn_palety_v1';
let pallets=JSON.parse(localStorage.getItem(KEY)||'[]');
let editingId=null;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function save(){localStorage.setItem(KEY,JSON.stringify(pallets));document.getElementById('saveStatus').textContent='✓ Zapisano automatycznie';setTimeout(()=>document.getElementById('saveStatus').textContent='Dane zapisują się automatycznie',1500)}
function totalQty(p){return p.items.reduce((a,i)=>a+(Number(i.qty)||0),0)}
function render(){
 const q=document.getElementById('search').value.toLowerCase().trim();
 const list=pallets.filter(p=>!q || [p.code,p.name,p.location,...p.items.map(i=>i.name+' '+i.sku)].join(' ').toLowerCase().includes(q));
 document.getElementById('palletGrid').innerHTML=list.length?list.map(p=>`
  <article class="pallet" onclick="openDetails('${p.id}')">
   <div class="pallet-head"><div><div class="pallet-code">${esc(p.code)}</div><div class="pallet-name">${esc(p.name||'Bez nazwy')}</div></div><span class="badge">${p.items.length} ${p.items.length===1?'produkt':'produktów'}</span></div>
   <div class="pallet-meta"><span>📍 ${esc(p.location||'Brak lokalizacji')}</span><strong>${totalQty(p)} szt.</strong></div>
   <div class="pallet-actions" onclick="event.stopPropagation()"><button class="secondary" onclick="openPalletForm('${p.id}')">Edytuj</button><button class="danger" onclick="deletePallet('${p.id}')">Usuń</button></div>
  </article>`).join(''):`<div class="empty"><div class="icon">📦</div><strong>Brak palet</strong><div>Dodaj pierwszą paletę, aby rozpocząć prowadzenie magazynu.</div></div>`;
 document.getElementById('statPallets').textContent=pallets.length;
 document.getElementById('statItems').textContent=pallets.reduce((a,p)=>a+p.items.length,0);
 document.getElementById('statQty').textContent=pallets.reduce((a,p)=>a+totalQty(p),0);
 document.getElementById('statDate').textContent=new Date().toLocaleDateString('pl-PL');
}
function openPalletForm(id=null){
 editingId=id;
 const p=id?pallets.find(x=>x.id===id):null;
 document.getElementById('formTitle').textContent=p?'Edytuj paletę':'Dodaj paletę';
 document.getElementById('pCode').value=p?.code||nextCode();
 document.getElementById('pName').value=p?.name||'';
 document.getElementById('pLocation').value=p?.location||'';
 document.getElementById('itemRows').innerHTML='';
 (p?.items?.length?p.items:[{name:'',qty:'',sku:''}]).forEach(addItemRow);
 document.getElementById('formModal').classList.add('show');
}
function nextCode(){let n=1;while(pallets.some(p=>p.code===`P-${String(n).padStart(3,'0')}`))n++;return `P-${String(n).padStart(3,'0')}`}
function addItemRow(data={name:'',qty:'',sku:''}){
 const row=document.createElement('div');row.className='item-row';
 row.innerHTML=`<input class="iname" placeholder="Nazwa produktu" value="${esc(data.name)}"><input class="iqty" type="number" min="0" placeholder="Ilość" value="${esc(data.qty)}"><input class="isku" placeholder="SKU / kod" value="${esc(data.sku)}"><button class="remove-item" onclick="this.parentElement.remove()">×</button>`;
 document.getElementById('itemRows').appendChild(row);
}
function savePallet(){
 const code=document.getElementById('pCode').value.trim();
 if(!code){alert('Podaj numer palety.');return}
 const items=[...document.querySelectorAll('.item-row')].map(r=>({name:r.querySelector('.iname').value.trim(),qty:Number(r.querySelector('.iqty').value)||0,sku:r.querySelector('.isku').value.trim()})).filter(i=>i.name);
 const obj={id:editingId||crypto.randomUUID(),code,name:document.getElementById('pName').value.trim(),location:document.getElementById('pLocation').value.trim(),items,updatedAt:new Date().toISOString()};
 const duplicate=pallets.some(p=>p.code.toLowerCase()===code.toLowerCase()&&p.id!==obj.id);
 if(duplicate){alert('Paleta o takim numerze już istnieje.');return}
 if(editingId)pallets=pallets.map(p=>p.id===editingId?obj:p);else pallets.push(obj);
 save();render();closeModal('formModal');
}
function deletePallet(id){
 const p=pallets.find(x=>x.id===id);
 if(confirm(`Usunąć paletę ${p.code}? Tej operacji nie można cofnąć.`)){pallets=pallets.filter(x=>x.id!==id);save();render()}
}
function openDetails(id){
 const p=pallets.find(x=>x.id===id);
 document.getElementById('detailContent').innerHTML=`
  <div class="detail-title"><div><h2>${esc(p.code)}</h2><p>${esc(p.name||'Bez nazwy')}</p></div><div class="detail-actions"><button class="secondary" onclick="closeModal('detailModal');openPalletForm('${p.id}')">Edytuj</button><button class="close" onclick="closeModal('detailModal')">×</button></div></div>
  <div class="detail-info"><div class="info"><span>Lokalizacja</span><strong>${esc(p.location||'—')}</strong></div><div class="info"><span>Liczba pozycji</span><strong>${p.items.length}</strong></div><div class="info"><span>Łączna ilość</span><strong>${totalQty(p)} szt.</strong></div></div>
  ${p.items.length?`<table class="table"><thead><tr><th>Produkt</th><th>Ilość</th><th>SKU / kod</th></tr></thead><tbody>${p.items.map(i=>`<tr><td><strong>${esc(i.name)}</strong></td><td>${esc(i.qty)} szt.</td><td>${esc(i.sku||'—')}</td></tr>`).join('')}</tbody></table>`:'<div class="notice">Ta paleta nie ma jeszcze dodanych produktów.</div>'}
 `;
 document.getElementById('detailModal').classList.add('show');
}
function closeModal(id){document.getElementById(id).classList.remove('show')}
document.querySelectorAll('.modal-backdrop').forEach(x=>x.addEventListener('click',e=>{if(e.target===x)x.classList.remove('show')}));
function exportData(){
 const blob=new Blob([JSON.stringify(pallets,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='magazyn-palety.json';a.click();URL.revokeObjectURL(a.href);
}
function importData(e){
 const file=e.target.files[0];if(!file)return;
 const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data))throw 0;if(confirm('Import zastąpi obecne dane. Kontynuować?')){pallets=data;save();render()}}catch{alert('Nieprawidłowy plik danych.')}};r.readAsText(file);e.target.value='';
}
render();
</script>
</body>
</html>
